<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="拆拆 ChaiChai：让 AI 帮你拆开任何软件，看懂它是怎么运作的">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <!-- 打开的盒子：软件被“拆开” -->
  <g transform="translate(150 70)">
    <g stroke="#fde68a" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <line x1="110" y1="14" x2="110" y2="-14"/>
      <line x1="30" y1="34" x2="12" y2="10"/>
      <line x1="190" y1="34" x2="208" y2="10"/>
    </g>
    <path d="M20 130 L110 160 L200 130 L200 225 L110 255 L20 225 Z" fill="url(#box)"/>
    <path d="M110 160 L110 255" stroke="#92400e" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M20 130 L-18 92 L72 62 L110 100 Z" fill="url(#lid)" opacity="0.95"/>
    <path d="M200 130 L238 92 L148 62 L110 100 Z" fill="url(#lid)" opacity="0.85"/>
    <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#a5f3fc" text-anchor="middle">
      <text x="58" y="52">&lt;/&gt;</text>
      <text x="110" y="40">01</text>
      <text x="162" y="52">{ }</text>
    </g>
    <circle cx="110" cy="205" r="22" fill="#1e1b4b" fill-opacity="0.35"/>
    <circle cx="104" cy="199" r="11" fill="none" stroke="#fffbeb" stroke-width="5"/>
    <line x1="112" y1="207" x2="123" y2="218" stroke="#fffbeb" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#ffffff">
    <text x="470" y="150" font-size="76" font-weight="800">拆拆 <tspan font-size="56" font-weight="700" fill="#a5f3fc">ChaiChai</tspan></text>
    <text x="474" y="210" font-size="30" font-weight="500" fill="#e0e7ff">让 AI 帮你拆开任何软件，看懂它是怎么运作的</text>
    <g font-size="20" font-weight="600">
      <rect x="474" y="246" width="92" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
      <text x="520" y="272" text-anchor="middle">网页</text>
      <rect x="578" y="246" width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
      <text x="637" y="272" text-anchor="middle">桌面软件</text>
      <rect x="708" y="246" width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
      <text x="767" y="272" text-anchor="middle">安卓 App</text>
      <rect x="838" y="246" width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
      <text x="897" y="272" text-anchor="middle">Mac 应用</text>
      <rect x="968" y="246" width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
      <text x="1027" y="272" text-anchor="middle">网页游戏</text>
    </g>
  </g>
</svg>
